<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WINNORA | Essence of You</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">

        <div class="brand">
            <a href="index.html">
                <img src="logo.jpeg" alt="WINNORA Logo" class="logo">
            </a>
            <p>ESSENCE OF YOU</p>
        </div>

        <button class="menu-toggle"
                id="menu-toggle"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false">
            ☰
        </button>

       <nav class="main-nav" id="main-navigation">
            <a href="index.html">Home</a>
            <a href="jewels.html">Jewels</a>
            <a href="parfums.html">Parfums</a>
            <a href="about.html">Our Story</a>
            <a href="contact.html">Contact</a>
        </nav>

        <button class="cart-toggle" id="cart-toggle"
                type="button" aria-label="Open shopping cart"
                aria-expanded="false">
            🛍️
            <span class="cart-count" id="cart-count">0</span>
        </button>
        <!-- WINNORA Shopping Cart -->
        <div class="cart-overlay" id="cart-overlay"></div>

        <aside class="cart-panel" id="cart-panel"
               aria-label="Shopping cart"
               aria-hidden="true">

            <div class="cart-header">
                <h2>Your Shopping Bag</h2>

                <button class="cart-close" id="cart-close"
                        type="button" aria-label="Close cart">
                    &times;
                </button>
            </div>

            <div class="cart-items" id="cart-items">
                <p class="empty-cart">
                    Your shopping bag is currently empty.
                </p>
            </div>

            <div class="cart-footer">
                <div class="cart-total">
                    <span>Subtotal</span>
                    <strong id="cart-total">KES 0</strong>
                </div>

                <button class="checkout-button" id="checkout-button"
                        type="button" disabled>
                    PROCEED TO CHECKOUT
                </button>
            </div>

        </aside>
    </header>

    <main>

        <section id="home" class="hero-image">

            <img
                src="images/winnora-hero-banner.png"
                alt="WINNORA luxury jewellery and fragrance collection"
                class="hero-banner">

            <div class="hero-actions">

                <a href="jewels.html" class="hero-button">
                    EXPLORE JEWELS
                </a>

                <a href="parfums.html" class="hero-button secondary-button">
                    DISCOVER PARFUMS
                </a>

            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 WINNORA. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
